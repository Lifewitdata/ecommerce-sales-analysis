name: Verify SQL and notebook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MySQL queries against pandas
        run: python sql/verify_sql.py
      - name: Execute notebook and verify reproducible artifacts
        run: python verify_analysis.py
